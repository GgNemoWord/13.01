<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>main</title>
</head>
<body>
<h2>Events</h2>
{% for event in events %}
<p>{{ event.name }}</p>
<p>{{ event.date }}</p>
{% for att in event.attendee.all %}
<p>{{ att }}</p>
{% endfor %}
<hr>
{% endfor %}

<h2>Attendees</h2>
{% for attendee in attendees %}
<p>{{ attendee.name }}</p>
<p>{{ attendee.registration_date }}</p>
{% endfor %}
</body>
</html>
